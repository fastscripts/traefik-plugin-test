displayName: Header Processor
type: middleware
import: github.com/fastscripts/traefik-plugin-test

summary: A simple Traefik plugin that checks a request header and sets a response header.

testData:
  requestHeader: X-Custom-Request
  responseHeader: X-Custom-Response
  responseValue: "header-was-present"
  missingValue: "header-was-missing"
